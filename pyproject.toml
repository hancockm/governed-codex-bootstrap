[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "governed-codex-bootstrap"
version = "0.1.0"
description = "A clean-room bootstrap for evidence-led, governed software projects."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-xdist==3.8.0",
  "execnet==2.1.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
cache_dir = "tmp/pytest-cache"

[tool.setuptools.packages.find]
include = ["governance_bootstrap*"]
