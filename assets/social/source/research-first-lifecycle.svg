<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="628" viewBox="0 0 1200 628" role="img" aria-labelledby="title desc">
  <title id="title">Research-first lifecycle</title><desc id="desc">Exact source files become immutable records, candidates, reviewed conclusions, and canonical documents only after approval.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111F"/><stop offset="1" stop-color="#0B1B2D"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#4DE2C5"/></marker><style>.brand{font:700 18px 'Segoe UI',sans-serif;letter-spacing:2px;fill:#4DE2C5}.title{font:700 44px 'Segoe UI',sans-serif;fill:#F7FAFC}.sub{font:400 21px 'Segoe UI',sans-serif;fill:#A9B7C7}.card{fill:#102238;stroke:#29445F;stroke-width:2}.name{font:700 20px 'Segoe UI',sans-serif;fill:#F7FAFC}.detail{font:400 15px 'Segoe UI',sans-serif;fill:#A9B7C7}.line{stroke:#4DE2C5;stroke-width:3;fill:none;marker-end:url(#a)}.pill{font:700 17px 'Segoe UI',sans-serif;fill:#07111F}</style></defs>
  <rect width="1200" height="628" fill="url(#bg)"/><circle cx="1100" cy="10" r="210" fill="#F4C95D" opacity=".06"/>
  <text x="64" y="55" class="brand">GOVERNED CODEX BOOTSTRAP</text><text x="64" y="118" class="title">Start with sources—not a product story.</text><text x="64" y="154" class="sub">Research is preserved first. Promotion is a separate, governed decision.</text>
  <g transform="translate(64 225)"><rect width="186" height="170" rx="18" class="card"/><text x="20" y="36" class="name">Research inbox</text><rect x="20" y="57" width="48" height="32" rx="8" fill="#4DE2C5"/><text x="29" y="79" class="pill">.md</text><rect x="75" y="57" width="48" height="32" rx="8" fill="#8B7CFF"/><text x="85" y="79" class="pill">.txt</text><rect x="130" y="57" width="48" height="32" rx="8" fill="#F4C95D"/><text x="137" y="79" class="pill">.pdf</text><text x="20" y="122" class="detail">Exact user-supplied bytes</text><text x="20" y="146" class="detail">Origin + content hash</text></g>
  <path d="M250 310H292" class="line"/>
  <g transform="translate(292 225)"><rect width="190" height="170" rx="18" class="card"/><text x="20" y="38" class="name">Immutable intake</text><text x="20" y="78" class="detail">Content-addressed record</text><text x="20" y="104" class="detail">No silent conversion</text><text x="20" y="130" class="detail">No automatic promotion</text></g>
  <path d="M482 310H524" class="line"/>
  <g transform="translate(524 225)"><rect width="190" height="170" rx="18" class="card"/><text x="20" y="38" class="name">Candidate map</text><text x="20" y="78" class="detail">Sections · PDF pages</text><text x="20" y="104" class="detail">Duplicates · ambiguity</text><text x="20" y="130" class="detail">Dead ends retained</text></g>
  <path d="M714 310H756" class="line"/>
  <g transform="translate(756 225)"><rect width="174" height="170" rx="18" class="card"/><text x="20" y="38" class="name">Core review</text><text x="20" y="78" class="detail">Assumptions</text><text x="20" y="104" class="detail">Contradictions</text><text x="20" y="130" class="detail">User approval</text></g>
  <path d="M930 310H972" class="line"/>
  <g transform="translate(972 225)"><rect width="164" height="170" rx="18" fill="#12382F" stroke="#4DE2C5" stroke-width="2"/><text x="20" y="38" class="name">Canonical</text><text x="20" y="78" class="detail">Thesis</text><text x="20" y="104" class="detail">Architecture · spec</text><text x="20" y="130" class="detail">Roadmap · status</text></g>
  <path d="M843 395V459H605" stroke="#8B7CFF" stroke-width="2.5" stroke-dasharray="8 7" fill="none" marker-end="url(#a)"/><text x="630" y="492" class="detail">Not accepted? Retain it as evidence, candidate, or dead end.</text>
  <rect x="64" y="546" width="1072" height="2" fill="#29445F"/><text x="64" y="582" class="detail">The organizer maps evidence. It does not decide what is true.</text>
</svg>
