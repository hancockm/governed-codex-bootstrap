<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="628" viewBox="0 0 1200 628" role="img" aria-labelledby="title desc">
  <title id="title">Four explicit PDF intake outcomes</title>
  <desc id="desc">A terminal-style capture showing supported, dependency unavailable, no extractable text, and encrypted PDF boundaries.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111F"/><stop offset="1" stop-color="#0B1B2D"/></linearGradient>
    <style>
      .brand{font:700 18px 'Segoe UI',sans-serif;letter-spacing:2px;fill:#4DE2C5}
      .title{font:700 42px 'Segoe UI',sans-serif;fill:#F7FAFC}
      .sub{font:400 20px 'Segoe UI',sans-serif;fill:#A9B7C7}
      .chrome{font:600 14px 'Segoe UI',sans-serif;fill:#A9B7C7}
      .prompt{font:700 17px 'Cascadia Mono','Consolas',monospace;fill:#4DE2C5}
      .command{font:600 17px 'Cascadia Mono','Consolas',monospace;fill:#F7FAFC}
      .key{font:700 16px 'Cascadia Mono','Consolas',monospace;fill:#8B7CFF}
      .ok{font:700 16px 'Cascadia Mono','Consolas',monospace;fill:#4DE2C5}
      .warn{font:700 16px 'Cascadia Mono','Consolas',monospace;fill:#F4C95D}
      .detail{font:400 15px 'Cascadia Mono','Consolas',monospace;fill:#A9B7C7}
      .footer{font:500 17px 'Segoe UI',sans-serif;fill:#F7FAFC}
      .tag{font:700 14px 'Segoe UI',sans-serif;letter-spacing:1px;fill:#F4C95D}
    </style>
  </defs>
  <rect width="1200" height="628" fill="url(#bg)"/>
  <circle cx="1110" cy="-20" r="225" fill="#F4C95D" opacity=".07"/>
  <text x="64" y="52" class="brand">GOVERNED PDF INTAKE</text>
  <text x="64" y="108" class="title">Four outcomes. Nothing silently skipped.</text>
  <text x="64" y="144" class="sub">The source remains evidence even when extraction cannot proceed.</text>

  <g transform="translate(64 184)">
    <rect width="1072" height="360" rx="18" fill="#081019" stroke="#29445F" stroke-width="2"/>
    <path d="M18 0H1054Q1072 0 1072 18V48H0V18Q0 0 18 0Z" fill="#102238"/>
    <circle cx="25" cy="24" r="6" fill="#FF6B6B"/><circle cx="47" cy="24" r="6" fill="#F4C95D"/><circle cx="69" cy="24" r="6" fill="#4DE2C5"/>
    <text x="536" y="29" text-anchor="middle" class="chrome">project terminal · research intake receipt</text>

    <text x="24" y="82" class="prompt">$</text><text x="48" y="82" class="command">python tools/research_organizer.py scan</text>
    <text x="48" y="112" class="key">status:</text><text x="130" y="112" class="ok">supported</text>
    <text x="312" y="112" class="detail">handbook.md · exact hash recorded</text>

    <text x="48" y="158" class="key">status:</text><text x="130" y="158" class="warn">dependency_unavailable</text>
    <text x="392" y="158" class="detail">reason: pdf_dependency_unavailable</text>
    <text x="392" y="181" class="detail">action: ask before installing the pinned parser</text>

    <text x="24" y="227" class="prompt">$</text><text x="48" y="227" class="command">python tools/research_organizer.py build</text>
    <text x="48" y="257" class="key">diagnostic:</text><text x="175" y="257" class="warn">no_extractable_text</text>
    <text x="412" y="257" class="detail">page 2 · OCR not attempted</text>

    <text x="48" y="303" class="key">boundary:</text><text x="154" y="303" class="warn">encrypted</text>
    <text x="282" y="303" class="detail">result: unavailable · processing stopped</text>
    <text x="282" y="326" class="detail">passwords: not requested or stored</text>

    <g transform="translate(844 65)"><rect width="198" height="42" rx="12" fill="#2C2A20" stroke="#F4C95D"/><text x="99" y="27" text-anchor="middle" class="tag">EXPLICIT RECEIPTS</text></g>
  </g>
  <text x="64" y="585" class="footer">Preserve bytes · report the boundary · never invent extractable content.</text>
  <text x="1136" y="585" text-anchor="end" class="tag">NO OCR · NO PASSWORD GUESSING</text>
</svg>
