<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="628" viewBox="0 0 1200 628" role="img" aria-labelledby="title desc">
  <title id="title">Governed PDF research</title><desc id="desc">PDF bytes are preserved, installation requires consent, and extraction limits stay visible.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111F"/><stop offset="1" stop-color="#0B1B2D"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#4DE2C5"/></marker><style>.brand{font:700 18px 'Segoe UI',sans-serif;letter-spacing:2px;fill:#4DE2C5}.title{font:700 44px 'Segoe UI',sans-serif;fill:#F7FAFC}.sub{font:400 21px 'Segoe UI',sans-serif;fill:#A9B7C7}.card{fill:#102238;stroke:#29445F;stroke-width:2}.name{font:700 20px 'Segoe UI',sans-serif;fill:#F7FAFC}.detail{font:400 15px 'Segoe UI',sans-serif;fill:#A9B7C7}.line{stroke:#4DE2C5;stroke-width:3;fill:none;marker-end:url(#a)}.badge{font:700 14px 'Segoe UI',sans-serif}</style></defs>
  <rect width="1200" height="628" fill="url(#bg)"/><circle cx="1130" cy="120" r="210" fill="#F4C95D" opacity=".07"/>
  <text x="64" y="55" class="brand">RESEARCH INTAKE</text><text x="64" y="118" class="title">PDF support without silent installation.</text><text x="64" y="154" class="sub">Exact source first. Explicit consent next. Limits always visible.</text>
  <path d="M276 318H326" class="line"/><path d="M546 318H596" class="line"/><path d="M816 318H866" class="line"/>
  <g transform="translate(64 220)"><rect width="212" height="196" rx="18" class="card"/><rect x="22" y="22" width="54" height="38" rx="9" fill="#F4C95D"/><text x="31" y="47" class="badge" fill="#07111F">.pdf</text><text x="22" y="94" class="name">Preserve bytes</text><text x="22" y="127" class="detail">Content-addressed source</text><text x="22" y="153" class="detail">Hash + provenance</text><text x="22" y="177" class="detail">No parser required</text></g>
  <g transform="translate(326 220)"><rect width="220" height="196" rx="18" fill="#2D294D" stroke="#8B7CFF" stroke-width="2"/><text x="22" y="50" class="name">Core asks first</text><text x="22" y="86" class="detail">pypdf 6.14.2</text><text x="22" y="112" class="detail">BSD-3-Clause record</text><text x="22" y="138" class="detail">No implicit download</text><rect x="22" y="157" width="126" height="25" rx="12" fill="#8B7CFF"/><text x="35" y="175" class="badge" fill="#07111F">USER APPROVAL</text></g>
  <g transform="translate(596 220)"><rect width="220" height="196" rx="18" fill="#12382F" stroke="#4DE2C5" stroke-width="2"/><text x="22" y="50" class="name">Extract pages</text><text x="22" y="86" class="detail">Pinned native-text parser</text><text x="22" y="112" class="detail">Stable page order</text><text x="22" y="138" class="detail">Candidate fingerprints</text><text x="22" y="164" class="detail">Exact source remains primary</text></g>
  <g transform="translate(866 220)"><rect width="270" height="196" rx="18" class="card"/><text x="22" y="50" class="name">Limits stay explicit</text><text x="22" y="86" class="detail">NO OCR → no_extractable_text</text><text x="22" y="112" class="detail">ENCRYPTED → unavailable</text><text x="22" y="138" class="detail">MISSING PARSER → unavailable</text><text x="22" y="164" class="detail">Nothing silently skipped</text></g>
  <rect x="64" y="501" width="320" height="45" rx="22" fill="#102238"/><circle cx="89" cy="523" r="9" fill="#4DE2C5"/><text x="108" y="529" class="detail">.md and .txt work with the base install</text>
  <text x="64" y="586" class="detail">Declining installation preserves the PDF as visible, immutable, unavailable evidence.</text>
</svg>
