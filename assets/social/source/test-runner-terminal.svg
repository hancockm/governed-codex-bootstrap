<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="628" viewBox="0 0 1200 628" role="img" aria-labelledby="title desc">
  <title id="title">Five governed pytest profiles</title>
  <desc id="desc">A terminal-style command reference for focused, failed, affected, broad, and full test-runner profiles.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111F"/><stop offset="1" stop-color="#0B1B2D"/></linearGradient>
    <style>
      .brand{font:700 18px 'Segoe UI',sans-serif;letter-spacing:2px;fill:#4DE2C5}
      .title{font:700 42px 'Segoe UI',sans-serif;fill:#F7FAFC}
      .sub{font:400 20px 'Segoe UI',sans-serif;fill:#A9B7C7}
      .chrome{font:600 14px 'Segoe UI',sans-serif;fill:#A9B7C7}
      .prompt{font:700 17px 'Cascadia Mono','Consolas',monospace;fill:#4DE2C5}
      .command{font:600 17px 'Cascadia Mono','Consolas',monospace;fill:#F7FAFC}
      .result{font:400 15px 'Cascadia Mono','Consolas',monospace;fill:#A9B7C7}
      .tag{font:700 14px 'Segoe UI',sans-serif;letter-spacing:1px;fill:#F4C95D}
      .footer{font:500 17px 'Segoe UI',sans-serif;fill:#F7FAFC}
    </style>
  </defs>
  <rect width="1200" height="628" fill="url(#bg)"/>
  <circle cx="1100" cy="-30" r="230" fill="#8B7CFF" opacity=".08"/>
  <text x="64" y="52" class="brand">GOVERNED TEST EXECUTION</text>
  <text x="64" y="108" class="title">Five test profiles. One development lifecycle.</text>
  <text x="64" y="144" class="sub">Use the cheapest evidence that answers the current question.</text>

  <g transform="translate(64 184)">
    <rect width="1072" height="360" rx="18" fill="#081019" stroke="#29445F" stroke-width="2"/>
    <path d="M18 0H1054Q1072 0 1072 18V48H0V18Q0 0 18 0Z" fill="#102238"/>
    <circle cx="25" cy="24" r="6" fill="#FF6B6B"/><circle cx="47" cy="24" r="6" fill="#F4C95D"/><circle cx="69" cy="24" r="6" fill="#4DE2C5"/>
    <text x="536" y="29" text-anchor="middle" class="chrome">project terminal · tools/test_runner.py</text>

    <text x="24" y="82" class="prompt">$</text><text x="48" y="82" class="command">python tools/test_runner.py focused tests/test_research.py</text>
    <text x="48" y="105" class="result">↳ current surface · stop at the first failure</text>

    <text x="24" y="140" class="prompt">$</text><text x="48" y="140" class="command">python tools/test_runner.py failed</text>
    <text x="48" y="163" class="result">↳ cached failures only · no silent full-suite fallback</text>

    <text x="24" y="198" class="prompt">$</text><text x="48" y="198" class="command">python tools/test_runner.py affected --base origin/master</text>
    <text x="48" y="221" class="result">↳ Git diff → declared impact map · unknown runtime widens</text>

    <text x="24" y="256" class="prompt">$</text><text x="48" y="256" class="command">python tools/test_runner.py broad</text>
    <text x="48" y="279" class="result">↳ conservative boundary · stop after three failures</text>

    <text x="24" y="314" class="prompt">$</text><text x="48" y="314" class="command">python tools/test_runner.py full</text>
    <text x="48" y="337" class="result">↳ registered parallel-safe phase → exclusive serial phase</text>

    <g transform="translate(831 65)"><rect width="211" height="42" rx="12" fill="#2C2A20" stroke="#F4C95D"/><text x="105" y="27" text-anchor="middle" class="tag">ITERATE → VERIFY</text></g>
  </g>
  <text x="64" y="585" class="footer">Terra triages with the first four. Luna runs full once on the final candidate commit.</text>
  <text x="1136" y="585" text-anchor="end" class="tag">FAIL FAST · FINISH BROAD</text>
</svg>
