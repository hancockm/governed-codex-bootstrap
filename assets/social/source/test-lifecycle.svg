<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="628" viewBox="0 0 1200 628" role="img" aria-labelledby="title desc">
  <title id="title">Efficient governed testing lifecycle</title><desc id="desc">Fast local triage leads to one final parallel-safe and serial verification run.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111F"/><stop offset="1" stop-color="#0B1B2D"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#4DE2C5"/></marker><style>.brand{font:700 18px 'Segoe UI',sans-serif;letter-spacing:2px;fill:#4DE2C5}.title{font:700 44px 'Segoe UI',sans-serif;fill:#F7FAFC}.sub{font:400 21px 'Segoe UI',sans-serif;fill:#A9B7C7}.card{fill:#102238;stroke:#29445F;stroke-width:2}.name{font:700 18px 'Segoe UI',sans-serif;fill:#F7FAFC}.detail{font:400 15px 'Segoe UI',sans-serif;fill:#A9B7C7}.line{stroke:#4DE2C5;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="628" fill="url(#bg)"/><circle cx="1140" cy="-40" r="220" fill="#4DE2C5" opacity=".06"/>
  <text x="64" y="55" class="brand">DEVELOPMENT TESTING</text><text x="64" y="118" class="title">Fast feedback first. Full evidence once.</text><text x="64" y="154" class="sub">Do not relaunch thousands of tests while debugging one broken boundary.</text>
  <text x="64" y="216" class="name">ITERATION LOOP</text>
  <g transform="translate(64 240)"><rect width="170" height="112" rx="16" class="card"/><text x="20" y="42" class="name">focused</text><text x="20" y="72" class="detail">Current surface</text><text x="20" y="94" class="detail">Stop on first failure</text></g>
  <path d="M234 296H264" class="line"/>
  <g transform="translate(264 240)"><rect width="170" height="112" rx="16" class="card"/><text x="20" y="42" class="name">failed</text><text x="20" y="72" class="detail">Cached failures only</text><text x="20" y="94" class="detail">Never expands silently</text></g>
  <path d="M434 296H464" class="line"/>
  <g transform="translate(464 240)"><rect width="170" height="112" rx="16" class="card"/><text x="20" y="42" class="name">affected</text><text x="20" y="72" class="detail">Git diff → test map</text><text x="20" y="94" class="detail">Unknown fails closed</text></g>
  <path d="M634 296H664" class="line"/>
  <g transform="translate(664 240)"><rect width="170" height="112" rx="16" class="card"/><text x="20" y="42" class="name">broad</text><text x="20" y="72" class="detail">Boundary regression</text><text x="20" y="94" class="detail">Bounded failures</text></g>
  <path d="M834 296H884" class="line"/>
  <g transform="translate(884 210)"><rect width="252" height="172" rx="20" fill="#12382F" stroke="#4DE2C5" stroke-width="2"/><text x="22" y="42" class="name">FINAL CANDIDATE</text><text x="22" y="80" class="detail">1. Parallel-safe suite</text><text x="22" y="108" class="detail">2. Exclusive serial suite</text><text x="22" y="136" class="detail">Exact commit · one final run</text></g>
  <path d="M1010 382V450H348V354" stroke="#F4C95D" stroke-width="2.5" stroke-dasharray="8 7" fill="none" marker-end="url(#a)"/><text x="492" y="482" class="detail">Failure returns to serial triage—not another full parallel launch.</text>
  <rect x="64" y="541" width="1072" height="2" fill="#29445F"/><text x="64" y="579" class="detail">Testing is a lifecycle profile, not one global pytest command.</text>
</svg>
