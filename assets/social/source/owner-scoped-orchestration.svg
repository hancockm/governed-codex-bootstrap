<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="628" viewBox="0 0 1200 628" role="img" aria-labelledby="title desc">
  <title id="title">Owner-scoped orchestration</title><desc id="desc">Sol plans, Terra implements, Luna verifies read-only, and Core integrates.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111F"/><stop offset="1" stop-color="#0B1B2D"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#4DE2C5"/></marker><style>.brand{font:700 18px 'Segoe UI',sans-serif;letter-spacing:2px;fill:#4DE2C5}.title{font:700 44px 'Segoe UI',sans-serif;fill:#F7FAFC}.sub{font:400 21px 'Segoe UI',sans-serif;fill:#A9B7C7}.card{fill:#102238;stroke:#29445F;stroke-width:2}.role{font:700 28px 'Segoe UI',sans-serif;fill:#F7FAFC}.model{font:700 15px 'Segoe UI',sans-serif;fill:#4DE2C5}.detail{font:400 16px 'Segoe UI',sans-serif;fill:#A9B7C7}.line{stroke:#4DE2C5;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="628" fill="url(#bg)"/><circle cx="1050" cy="-40" r="230" fill="#8B7CFF" opacity=".08"/>
  <text x="64" y="55" class="brand">OWNER-SCOPED ORCHESTRATION</text><text x="64" y="118" class="title">One owner. Three lanes. No blurred authority.</text><text x="64" y="154" class="sub">Creation and verification stay separate—even when the same project uses both.</text>
  <path d="M298 330H342" class="line"/><path d="M570 330H614" class="line"/><path d="M842 330H886" class="line"/>
  <g transform="translate(64 224)"><rect width="234" height="212" rx="20" fill="#12382F" stroke="#4DE2C5" stroke-width="2"/><text x="24" y="49" class="role">SOL</text><text x="24" y="78" class="model">OWNER ORCHESTRATOR</text><text x="24" y="119" class="detail">Plans and binds scope</text><text x="24" y="146" class="detail">Holds owner authority</text><text x="24" y="173" class="detail">Reviews and publishes</text></g>
  <g transform="translate(342 224)"><rect width="228" height="212" rx="20" class="card"/><text x="24" y="49" class="role">TERRA</text><text x="24" y="78" class="model">IMPLEMENTER</text><text x="24" y="119" class="detail">Changes packet paths</text><text x="24" y="146" class="detail">Runs focused checks</text><text x="24" y="173" class="detail">Creates candidate commit</text></g>
  <g transform="translate(614 224)"><rect width="228" height="212" rx="20" class="card"/><text x="24" y="49" class="role">LUNA</text><text x="24" y="78" class="model">VERIFICATION RUNNER</text><text x="24" y="119" class="detail">Reads exact candidate</text><text x="24" y="146" class="detail">Runs final verification</text><text x="24" y="173" class="detail">Never edits or commits</text></g>
  <g transform="translate(886 224)"><rect width="250" height="212" rx="20" fill="#2D294D" stroke="#8B7CFF" stroke-width="2"/><text x="24" y="49" class="role">CORE</text><text x="24" y="78" class="model">PRIMARY INTEGRATOR</text><text x="24" y="119" class="detail">Inspects owner evidence</text><text x="24" y="146" class="detail">Integrates or supersedes</text><text x="24" y="173" class="detail">Synchronizes primary</text></g>
  <path d="M728 436V488H456V438" stroke="#F4C95D" stroke-width="2.5" stroke-dasharray="8 7" fill="none" marker-end="url(#a)"/><text x="500" y="520" class="detail">Failure returns to Terra; the same Luna task verifies the correction.</text>
  <rect x="64" y="560" width="1072" height="2" fill="#29445F"/><text x="64" y="593" class="detail">The verifier cannot quietly repair its own evidence.</text>
</svg>
