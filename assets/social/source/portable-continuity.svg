<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="628" viewBox="0 0 1200 628" role="img" aria-labelledby="title desc">
  <title id="title">Portable owner continuity</title><desc id="desc">Git-backed continuity lets a fresh task, device, or employee rehydrate and verify an owner role.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111F"/><stop offset="1" stop-color="#0B1B2D"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#4DE2C5"/></marker><style>.brand{font:700 18px 'Segoe UI',sans-serif;letter-spacing:2px;fill:#4DE2C5}.title{font:700 44px 'Segoe UI',sans-serif;fill:#F7FAFC}.sub{font:400 21px 'Segoe UI',sans-serif;fill:#A9B7C7}.card{fill:#102238;stroke:#29445F;stroke-width:2}.name{font:700 20px 'Segoe UI',sans-serif;fill:#F7FAFC}.detail{font:400 15px 'Segoe UI',sans-serif;fill:#A9B7C7}.line{stroke:#4DE2C5;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="628" fill="url(#bg)"/><circle cx="90" cy="650" r="220" fill="#8B7CFF" opacity=".07"/>
  <text x="64" y="55" class="brand">OWNER CONTINUITY</text><text x="64" y="118" class="title">The role survives the chat, device, and employee.</text><text x="64" y="154" class="sub">Git carries bounded history. Fresh tasks still verify it against current evidence.</text>
  <path d="M276 325H326" class="line"/><path d="M546 325H596" class="line"/><path d="M816 325H866" class="line"/>
  <g transform="translate(64 230)"><rect width="212" height="190" rx="18" class="card"/><text x="22" y="46" class="name">Owner task</text><text x="22" y="84" class="detail">One bounded outcome</text><text x="22" y="112" class="detail">Decisions + corrections</text><text x="22" y="140" class="detail">Exact owner identity</text></g>
  <g transform="translate(326 230)"><rect width="220" height="190" rx="18" class="card"/><text x="22" y="46" class="name">Closeout bundle</text><text x="22" y="84" class="detail">Safe transcript</text><text x="22" y="112" class="detail">Receipts + A2A</text><text x="22" y="140" class="detail">Reconciliation evidence</text></g>
  <g transform="translate(596 230)"><rect width="220" height="190" rx="18" fill="#2D294D" stroke="#8B7CFF" stroke-width="2"/><text x="22" y="46" class="name">Authorized Git</text><text x="22" y="84" class="detail">Portable history</text><text x="22" y="112" class="detail">Integrity + provenance</text><text x="22" y="140" class="detail">Device-independent</text></g>
  <g transform="translate(866 204)"><rect width="270" height="242" rx="20" fill="#12382F" stroke="#4DE2C5" stroke-width="2"/><text x="22" y="46" class="name">Rehydrate the owner</text><text x="22" y="84" class="detail">Fresh Codex task</text><text x="22" y="112" class="detail">Another device</text><text x="22" y="140" class="detail">Authorized new employee</text><rect x="22" y="169" width="226" height="45" rx="12" fill="#07111F"/><text x="36" y="197" class="detail">VERIFY CURRENT EVIDENCE</text></g>
  <rect x="64" y="514" width="1072" height="2" fill="#29445F"/><text x="64" y="554" class="detail">Continuity locates history. It never outranks current canonical documents, source, tests, or Git.</text><text x="64" y="582" class="detail">Hidden reasoning, credentials, and another owner's copied transcript stay out.</text>
</svg>
